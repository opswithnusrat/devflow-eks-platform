<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Patrick Hand','Segoe Print','Comic Sans MS','Trebuchet MS',sans-serif"><defs><filter id="wob" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter><marker id="h-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1f2933"/></marker><marker id="h-ink-s" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#1f2933"/></marker><marker id="h-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#c0392b"/></marker><marker id="h-red-s" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#c0392b"/></marker><marker id="h-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#2e8b57"/></marker><marker id="h-green-s" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#2e8b57"/></marker><marker id="h-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1d6fa5"/></marker><marker id="h-blue-s" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#1d6fa5"/></marker></defs><rect width="1200" height="675" fill="#fbfbf8"/><g filter="url(#wob)"><rect x="930" y="622" width="222" height="38" rx="12" fill="#fbeccd" stroke="#b87400" stroke-width="3"/><rect x="48" y="165" width="170" height="105" rx="12" fill="#eceff1" stroke="#1f2933" stroke-width="3"/><rect x="258" y="165" width="190" height="105" rx="12" fill="#fbeccd" stroke="#b87400" stroke-width="3"/><rect x="488" y="165" width="180" height="105" rx="12" fill="#dcecf5" stroke="#1d6fa5" stroke-width="3"/><rect x="708" y="165" width="180" height="105" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><rect x="928" y="165" width="224" height="105" rx="12" fill="#fbeccd" stroke="#b87400" stroke-width="3"/><path d="M 218 217.5 L 258 217.5" fill="none" stroke="#1f2933" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#h-ink)"/><path d="M 448 217.5 L 488 217.5" fill="none" stroke="#1f2933" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#h-ink)"/><path d="M 668 217.5 L 708 217.5" fill="none" stroke="#1f2933" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#h-ink)"/><path d="M 888 217.5 L 928 217.5" fill="none" stroke="#1f2933" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#h-ink)"/><path d="M 1040 165 L 1040 142 L 578 142 L 578 165" fill="none" stroke="#1d6fa5" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#h-blue)"/><rect x="48" y="345" width="250" height="105" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><rect x="338" y="345" width="290" height="105" rx="12" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3"/><rect x="668" y="345" width="210" height="105" rx="12" fill="#fbeccd" stroke="#b87400" stroke-width="3"/><rect x="918" y="345" width="234" height="105" rx="12" fill="#eceff1" stroke="#1f2933" stroke-width="3"/><path d="M 578 270 L 578 310 L 173 310 L 173 345" fill="none" stroke="#1f2933" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#h-ink)"/><path d="M 298 397.5 L 338 397.5" fill="none" stroke="#1f2933" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#h-ink)"/><path d="M 628 397.5 L 668 397.5" fill="none" stroke="#1f2933" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#h-ink)"/><path d="M 878 397.5 L 918 397.5" fill="none" stroke="#1f2933" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#h-ink)"/><rect x="48" y="490" width="540" height="56" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><rect x="612" y="490" width="540" height="56" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><rect x="48" y="562" width="1104" height="46" rx="12" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3"/></g><text x="48" y="66" font-size="38" text-anchor="start" font-weight="700" fill="#1f2933">The agent workflow: one bounded loop</text><text x="48" y="102" font-size="21" text-anchor="start" font-weight="400" fill="#5b6770">Stateless /diagnose, read-only tools, and code that owns the trusted fields</text><text x="48" y="650" font-size="18" text-anchor="start" font-weight="400" fill="#5b6770">DevFlow AgentOps  ·  SRE Copilot on EKS</text><text x="1041.0" y="648" font-size="19" text-anchor="middle" font-weight="400" fill="#b87400">simulated model</text><text x="133.0" y="201" font-size="22" text-anchor="middle" font-weight="700" fill="#1f2933">POST</text><text x="133.0" y="226" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">/diagnose</text><text x="133.0" y="250" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">namespace</text><text x="353.0" y="201" font-size="22" text-anchor="middle" font-weight="700" fill="#1f2933">Guards</text><text x="353.0" y="226" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">daily budget → 429</text><text x="353.0" y="250" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">namespace list</text><text x="578.0" y="201" font-size="22" text-anchor="middle" font-weight="700" fill="#1f2933">Model call</text><text x="578.0" y="226" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">Ollama / OpenAI</text><text x="578.0" y="250" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">compatible</text><text x="798.0" y="201" font-size="22" text-anchor="middle" font-weight="700" fill="#1f2933">Run tool</text><text x="798.0" y="226" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">read-only</text><text x="798.0" y="250" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">scope-checked</text><text x="1040.0" y="201" font-size="21" text-anchor="middle" font-weight="700" fill="#1f2933">Sanitize output</text><text x="1040.0" y="225" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">redact · mask PII</text><text x="1040.0" y="249" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">drop injections · wrap</text><text x="630" y="134" font-size="18" text-anchor="start" font-weight="400" fill="#1d6fa5">next step (max 6 steps, 90 s)</text><text x="173.0" y="381" font-size="22" text-anchor="middle" font-weight="700" fill="#1f2933">Final answer</text><text x="173.0" y="406" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">JSON schema</text><text x="173.0" y="430" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">one retry if invalid</text><text x="483.0" y="381" font-size="21" text-anchor="middle" font-weight="700" fill="#1f2933">Code owns the facts</text><text x="483.0" y="405" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">workload name · citation</text><text x="483.0" y="429" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">low confidence at cap</text><text x="773.0" y="381" font-size="21" text-anchor="middle" font-weight="700" fill="#1f2933">Output guard</text><text x="773.0" y="405" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">block risky fix</text><text x="773.0" y="429" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">commands</text><text x="1035.0" y="381" font-size="22" text-anchor="middle" font-weight="700" fill="#1f2933">Response</text><text x="1035.0" y="406" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">usage · cost · trace id</text><text x="1035.0" y="430" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">audit event</text><text x="215" y="302" font-size="18" text-anchor="start" font-weight="400" fill="#5b6770">no more tool calls, or step / time cap hit</text><text x="318.0" y="513" font-size="18" text-anchor="middle" font-weight="400" fill="#1f2933">Unknown tools are refused.</text><text x="318.0" y="535" font-size="18" text-anchor="middle" font-weight="400" fill="#1f2933">A tool touches only the workload being diagnosed.</text><text x="882.0" y="513" font-size="18" text-anchor="middle" font-weight="400" fill="#1f2933">Own loop, not a framework: token usage is read</text><text x="882.0" y="535" font-size="18" text-anchor="middle" font-weight="400" fill="#1f2933">after every call, and output is redacted first.</text><text x="600.0" y="592" font-size="21" text-anchor="middle" font-weight="400" fill="#1f2933">It can only read. The worst case is a wrong answer, never a changed cluster.</text></svg>