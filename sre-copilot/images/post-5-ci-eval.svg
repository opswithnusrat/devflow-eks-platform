<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Patrick Hand','Segoe Print','Comic Sans MS','Trebuchet MS',sans-serif"><defs><filter id="wob" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter><marker id="h-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1f2933"/></marker><marker id="h-ink-s" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#1f2933"/></marker><marker id="h-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#c0392b"/></marker><marker id="h-red-s" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#c0392b"/></marker><marker id="h-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#2e8b57"/></marker><marker id="h-green-s" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#2e8b57"/></marker><marker id="h-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1d6fa5"/></marker><marker id="h-blue-s" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#1d6fa5"/></marker></defs><rect width="1200" height="675" fill="#fbfbf8"/><g filter="url(#wob)"><rect x="930" y="622" width="222" height="38" rx="12" fill="#fbeccd" stroke="#b87400" stroke-width="3"/><rect x="48" y="158" width="235" height="112" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><rect x="323" y="158" width="245" height="112" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><rect x="608" y="158" width="270" height="112" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><rect x="918" y="158" width="234" height="112" rx="12" fill="#dcecf5" stroke="#1d6fa5" stroke-width="3"/><path d="M 283 214.0 L 323 214.0" fill="none" stroke="#1f2933" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#h-ink)"/><path d="M 568 214.0 L 608 214.0" fill="none" stroke="#1f2933" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#h-ink)"/><path d="M 878 214.0 L 918 214.0" fill="none" stroke="#1f2933" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#h-ink)"/><rect x="48" y="338" width="380" height="130" rx="12" fill="#fbeccd" stroke="#b87400" stroke-width="3"/><rect x="468" y="338" width="340" height="130" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><rect x="848" y="338" width="150" height="56" rx="12" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3"/><rect x="848" y="412" width="150" height="56" rx="12" fill="#f8dedb" stroke="#c0392b" stroke-width="3"/><rect x="1028" y="412" width="124" height="56" rx="12" fill="#eceff1" stroke="#1f2933" stroke-width="3"/><path d="M 428 403.0 L 468 403.0" fill="none" stroke="#1f2933" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#h-ink)"/><path d="M 808 366 L 848 366" fill="none" stroke="#2e8b57" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#h-green)"/><path d="M 808 440 L 848 440" fill="none" stroke="#c0392b" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#h-red)"/><path d="M 998 440 L 1028 440" fill="none" stroke="#c0392b" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#h-red)"/><rect x="48" y="500" width="700" height="70" rx="12" fill="#f8dedb" stroke="#c0392b" stroke-width="3"/><rect x="790" y="500" width="362" height="70" rx="12" fill="#eceff1" stroke="#5b6770" stroke-width="3" stroke-dasharray="9 7"/></g><text x="48" y="66" font-size="38" text-anchor="start" font-weight="700" fill="#1f2933">Two eval gates, one pipeline</text><text x="48" y="102" font-size="21" text-anchor="start" font-weight="400" fill="#5b6770">CI blocks bad code. The canary blocks bad releases.</text><text x="48" y="650" font-size="18" text-anchor="start" font-weight="400" fill="#5b6770">DevFlow AgentOps  ·  SRE Copilot on EKS</text><text x="1041.0" y="648" font-size="19" text-anchor="middle" font-weight="400" fill="#b87400">simulated model</text><text x="48" y="142" font-size="22" text-anchor="start" font-weight="700" fill="#1d6fa5">GATE 1 · CI  (before an image exists)</text><text x="165.5" y="210" font-size="22" text-anchor="middle" font-weight="700" fill="#1f2933">Lint</text><text x="165.5" y="234" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">ruff · corpus lint</text><text x="445.5" y="210" font-size="22" text-anchor="middle" font-weight="700" fill="#1f2933">88+ tests</text><text x="445.5" y="234" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">incl. red-team cases</text><text x="743.0" y="198" font-size="22" text-anchor="middle" font-weight="700" fill="#1f2933">Retrieval gate</text><text x="743.0" y="222" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">hit@3 ≥ 0.85</text><text x="743.0" y="246" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">real embedder</text><text x="1035.0" y="210" font-size="22" text-anchor="middle" font-weight="700" fill="#1f2933">Image → ECR</text><text x="1035.0" y="234" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">only if all pass</text><text x="48" y="322" font-size="22" text-anchor="start" font-weight="700" fill="#2e8b57">GATE 2 · CANARY  (before 100 % of traffic)</text><text x="238.0" y="387" font-size="22" text-anchor="middle" font-weight="700" fill="#1f2933">Eval Job on the canary</text><text x="238.0" y="411" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">accuracy ≥ 0.85 · citation ≥ 0.75</text><text x="238.0" y="435" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">0 false alarms · cost ≤ $0.10</text><text x="638.0" y="387" font-size="22" text-anchor="middle" font-weight="700" fill="#1f2933">SLO checks (Mimir)</text><text x="638.0" y="411" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">error rate &lt; 5 %</text><text x="638.0" y="435" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">p95 &lt; 30 s · cost / diagnosis</text><text x="923.0" y="373" font-size="21" text-anchor="middle" font-weight="700" fill="#1f2933">Promote</text><text x="923.0" y="447" font-size="21" text-anchor="middle" font-weight="700" fill="#1f2933">Abort</text><text x="1090.0" y="435" font-size="17" text-anchor="middle" font-weight="400" fill="#1f2933">stable keeps</text><text x="1090.0" y="456" font-size="17" text-anchor="middle" font-weight="400" fill="#1f2933">serving</text><text x="398.0" y="531" font-size="22" text-anchor="middle" font-weight="700" fill="#1f2933">Real catch: canary scored 0.375 &lt; 0.85 → aborted</text><text x="398.0" y="555" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">cause: the simulator, since fixed → re-released → passed</text><text x="971.0" y="531" font-size="21" text-anchor="middle" font-weight="700" fill="#5b6770">CI agent-eval job</text><text x="971.0" y="554" font-size="18" text-anchor="middle" font-weight="400" fill="#5b6770">needs an LLM endpoint · off</text></svg>