<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="'Patrick Hand','Segoe Print','Comic Sans MS','Trebuchet MS',sans-serif"><defs><filter id="wob" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1f2933"/></marker></defs><rect width="1080" height="1350" fill="#fbfbf8"/><g filter="url(#wob)"><rect x="894" y="38" width="138" height="38" rx="10" fill="#dcf0e5" stroke="#2e8b57" stroke-width="2.6"/><rect x="48" y="200" width="984" height="98.4" rx="14" fill="#f8dedb" stroke="#c0392b" stroke-width="3.2"/><path d="M 540 302.4 L 540 328.4" stroke="#c0392b" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="332.4" width="984" height="171.2" rx="14" fill="#dcecf5" stroke="#1d6fa5" stroke-width="3.2"/><path d="M 540 507.59999999999997 L 540 533.5999999999999" stroke="#1d6fa5" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="537.5999999999999" width="984" height="171.2" rx="14" fill="#fbeccd" stroke="#b87400" stroke-width="3.2"/><path d="M 540 712.8 L 540 738.8" stroke="#b87400" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="742.8" width="984" height="98.4" rx="14" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3.2"/><path d="M 540 845.1999999999999 L 540 871.1999999999999" stroke="#2e8b57" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="875.1999999999999" width="984" height="134.8" rx="14" fill="#eceff1" stroke="#5b6770" stroke-width="3.2"/><path d="M 540 1014.0 L 540 1040.0" stroke="#5b6770" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="1044.0" width="984" height="131.2" rx="14" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3.2"/></g><text x="48" y="86" font-size="56" font-weight="700" fill="#1f2933" text-anchor="start">Mimir</text><text x="48" y="130" font-size="28" font-weight="400" fill="#5b6770" text-anchor="start">Long-term metrics storage in S3</text><text x="48" y="168" font-size="20" font-weight="400" fill="#1d6fa5" text-anchor="start">Observability  ·  Post 21 of 37</text><text x="963.0" y="63" font-size="19" font-weight="400" fill="#2e8b57" text-anchor="middle">ran on EKS</text><text x="72" y="234" font-size="19" font-weight="700" fill="#c0392b" text-anchor="start">THE OLD WAY</text><text x="72" y="269" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">A Prometheus disk that can't hold months of data cheaply.</text><text x="72" y="366.4" font-size="19" font-weight="700" fill="#1d6fa5" text-anchor="start">WHY DEVFLOW DOES IT DIFFERENTLY</text><text x="72" y="401" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">• S3-backed, months of retention with no disk to size.</text><text x="72" y="438" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">• Alloy remote-writes directly; no relay.</text><text x="72" y="474" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">• Grafana queries it as the metrics datasource.</text><text x="72" y="571.5999999999999" font-size="19" font-weight="700" fill="#b87400" text-anchor="start">WHAT BROKE</text><text x="72" y="607" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">The data was there. Alloy wrote under one tenant and Grafana</text><text x="72" y="643" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">queried another: both succeeded, neither errored, they talked</text><text x="72" y="679" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">to different rooms.</text><text x="72" y="776.8" font-size="19" font-weight="700" fill="#2e8b57" text-anchor="start">THE FIX</text><text x="72" y="812" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">multitenancy_enabled: false, set explicitly on both sides.</text><text x="72" y="909.1999999999999" font-size="19" font-weight="700" fill="#5b6770" text-anchor="start">WORTH KNOWING</text><text x="72" y="944" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">I spent longer checking whether Alloy scraped than fixing the</text><text x="72" y="981" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">tenant mismatch.</text><text x="78" y="1080.0" font-size="19" font-weight="700" fill="#2e8b57" text-anchor="start">TAKEAWAY</text><text x="78" y="1115" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">'No data' is the hardest bug shape: it looks like</text><text x="78" y="1157" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">nothing happened yet.</text><text x="48" y="1320" font-size="18" font-weight="400" fill="#5b6770" text-anchor="start">DevFlow platform series · EKS · GitOps · AgentOps</text><text x="1032" y="1320" font-size="18" font-weight="400" fill="#5b6770" text-anchor="end">#Mimir</text></svg>