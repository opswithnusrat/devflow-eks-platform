)"/><path d="M 1054.0 262 L 1054.0 312 L 600.0 312 L 600.0 366" fill="none" stroke="#1d6fa5" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#h-blue)"/><rect x="48" y="500" width="1104" height="46" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><rect x="48" y="560" width="1104" height="50" rx="12" fill="#dcecf5" stroke="#1d6fa5" stroke-width="3"/></g><text x="48" y="66" font-size="38" text-anchor="start" font-weight="700" fill="#1f2933">The RAG pipeline: runbooks the agent can cite</text><text x="48" y="102" font-size="21" text-anchor="start" font-weight="400" fill="#5b6770">Built once offline, searched on demand, tested on its own</text><text x="48" y="650" font-size="18" text-anchor="start" font-weight="400" fill="#5b6770">DevFlow AgentOps  ·  SRE Copilot on EKS</text><text x="1041.0" y="648" font-size="19" text-anchor="middle" font-weight="400" fill="#b87400">simulated model</text><text x="48" y="146" font-size="21" text-anchor="start" font-weight="700" fill="#1d6fa5">INGESTION  (offline, in CI too)</text><text x="146.0" y="193" font-size="21" text-anchor="middle" font-weight="700" fill="#1f2933">16 runbooks</text><text x="146.0" y="218" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">Markdown</text><text x="146.0" y="242" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">one ## per step</text><text x="373.0" y="193" font-size="21" text-anchor="middle" font-weight="700" fill="#1f2933">Lint</text><text x="373.0" y="218" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">secrets scan</text><text x="373.0" y="242" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">category required</text><text x="600.0" y="193" font-size="21" text-anchor="middle" font-weight="700" fill="#1f2933">Chunk</text><text x="600.0" y="218" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">one per ## section</text><text x="600.0" y="242" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">77 chunks</text><text x="827.0" y="193" font-size="21" text-anchor="middle" font-weight="700" fill="#1f2933">Embed</text><text x="827.0" y="218" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">fastembed bge-small</text><text x="827.0" y="242" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">runs locally</text><text x="1054.0" y="193" font-size="21" text-anchor="middle" font-weight="700" fill="#1f2933">Qdrant</text><text x="1054.0" y="218" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">collection</text><text x="1054.0" y="242" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">runbooks</text><text x="48" y="352" font-size="21" text-anchor="start" font-weight="700" fill="#2e8b57">QUERY  (every search_runbooks call)</text><text x="146.0" y="401" font-size="21" text-anchor="middle" font-weight="700" fill="#1f2933">Error words</text><text x="146.0" y="426" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">OOMKilled · 137</text><text x="146.0" y="450" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">from tool evidence</text><text x="373.0" y="401" font-size="21" text-anchor="middle" font-weight="700" fill="#1f2933">Sharpen</text><text x="373.0" y="426" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">model query plus</text><text x="373.0" y="450" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">exact error words</text><text x="600.0" y="401" font-size="21" text-anchor="middle" font-weight="700" fill="#1f2933">Embed + search</text><text x="600.0" y="426" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">top-k by similarity</text><text x="600.0" y="450" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">p95 475 ms</text><text x="827.0" y="401" font-size="21" text-anchor="middle" font-weight="700" fill="#1f2933">Hits</text><text x="827.0" y="426" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">file#section</text><text x="827.0" y="450" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">score · category</text><text x="1054.0" y="401" font-size="21" text-anchor="middle" font-weight="700" fill="#1f2933">Citation repair</text><text x="1054.0" y="426" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">code checks the</text><text x="1054.0" y="450" font-size="19" text-anchor="middle" font-weight="400" fill="#1f2933">cited runbook</text><text x="600.0" y="530" font-size="20" text-anchor="middle" font-weight="400" fill="#1f2933">A finding cites runbooks/oomkilled.md#symptoms: the section is the citation unit.</text><text x="600.0" y="592" font-size="20" text-anchor="middle" font-weight="400" fill="#1f2933">Retrieval is tested alone: hit@3 gate ≥ 0.85 in CI, 1.0 on the lab. A weak model cannot hide a retrieval bug.</text></svg>