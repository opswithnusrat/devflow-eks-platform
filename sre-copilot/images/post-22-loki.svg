<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="'Patrick Hand','Segoe Print','Comic Sans MS','Trebuchet MS',sans-serif"><defs><filter id="wob" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1f2933"/></marker></defs><rect width="1080" height="1350" fill="#fbfbf8"/><g filter="url(#wob)"><rect x="894" y="38" width="138" height="38" rx="10" fill="#dcf0e5" stroke="#2e8b57" stroke-width="2.6"/><rect x="48" y="200" width="984" height="134.8" rx="14" fill="#f8dedb" stroke="#c0392b" stroke-width="3.2"/><path d="M 540 338.8 L 540 364.8" stroke="#c0392b" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="368.8" width="984" height="244.0" rx="14" fill="#dcecf5" stroke="#1d6fa5" stroke-width="3.2"/><path d="M 540 616.8 L 540 642.8" stroke="#1d6fa5" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="646.8" width="984" height="134.8" rx="14" fill="#fbeccd" stroke="#b87400" stroke-width="3.2"/><path d="M 540 785.5999999999999 L 540 811.5999999999999" stroke="#b87400" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="815.5999999999999" width="984" height="134.8" rx="14" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3.2"/><path d="M 540 954.3999999999999 L 540 980.3999999999999" stroke="#2e8b57" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="984.3999999999999" width="984" height="98.4" rx="14" fill="#eceff1" stroke="#5b6770" stroke-width="3.2"/><path d="M 540 1086.8 L 540 1112.8" stroke="#5b6770" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="1116.8" width="984" height="131.2" rx="14" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3.2"/></g><text x="48" y="86" font-size="56" font-weight="700" fill="#1f2933" text-anchor="start">Loki</text><text x="48" y="130" font-size="28" font-weight="400" fill="#5b6770" text-anchor="start">Logs in S3, queried by field</text><text x="48" y="168" font-size="20" font-weight="400" fill="#1d6fa5" text-anchor="start">Observability  ·  Post 22 of 37</text><text x="963.0" y="63" font-size="19" font-weight="400" fill="#2e8b57" text-anchor="middle">ran on EKS</text><text x="72" y="234" font-size="19" font-weight="700" fill="#c0392b" text-anchor="start">THE OLD WAY</text><text x="72" y="269" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">kubectl logs per pod, no cross-service view, and nothing</text><text x="72" y="305" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">survives an eviction. Or a heavy ELK stack.</text><text x="72" y="402.8" font-size="19" font-weight="700" fill="#1d6fa5" text-anchor="start">WHY DEVFLOW DOES IT DIFFERENTLY</text><text x="72" y="438" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">• Every container's stdout goes to one store, labelled by</text><text x="72" y="474" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">   namespace and pod.</text><text x="72" y="511" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">• Structured JSON lets | json | status="502" match a parsed</text><text x="72" y="547" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">   field, not text.</text><text x="72" y="583" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">• Cluster events arrive as log lines too.</text><text x="72" y="680.8" font-size="19" font-weight="700" fill="#b87400" text-anchor="start">WHAT BROKE</text><text x="72" y="716" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">Loki has no retention limit by default: storage grows</text><text x="72" y="752" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">forever.</text><text x="72" y="849.5999999999999" font-size="19" font-weight="700" fill="#2e8b57" text-anchor="start">THE FIX</text><text x="72" y="885" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">retention_period: 720h and a compactor, before it became an</text><text x="72" y="921" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">S3 bill.</text><text x="72" y="1018.3999999999999" font-size="19" font-weight="700" fill="#5b6770" text-anchor="start">WORTH KNOWING</text><text x="72" y="1053" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">The query: {namespace="demo-dev"} | json | status="502".</text><text x="78" y="1152.8" font-size="19" font-weight="700" fill="#2e8b57" text-anchor="start">TAKEAWAY</text><text x="78" y="1188" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">The tools in this stack don't fail loudly. Loki won't</text><text x="78" y="1230" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">warn you it's about to grow forever.</text><text x="48" y="1320" font-size="18" font-weight="400" fill="#5b6770" text-anchor="start">DevFlow platform series · EKS · GitOps · AgentOps</text><text x="1032" y="1320" font-size="18" font-weight="400" fill="#5b6770" text-anchor="end">#Loki</text></svg>