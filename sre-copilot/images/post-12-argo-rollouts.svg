<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="'Patrick Hand','Segoe Print','Comic Sans MS','Trebuchet MS',sans-serif"><defs><filter id="wob" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1f2933"/></marker></defs><rect width="1080" height="1350" fill="#fbfbf8"/><g filter="url(#wob)"><rect x="894" y="38" width="138" height="38" rx="10" fill="#dcf0e5" stroke="#2e8b57" stroke-width="2.6"/><rect x="48" y="200" width="984" height="129.60000000000002" rx="14" fill="#f8dedb" stroke="#c0392b" stroke-width="3.2"/><path d="M 540 333.6 L 540 359.6" stroke="#c0392b" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="363.6" width="984" height="231.0" rx="14" fill="#dcecf5" stroke="#1d6fa5" stroke-width="3.2"/><path d="M 540 598.6 L 540 624.6" stroke="#1d6fa5" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="628.6" width="984" height="163.4" rx="14" fill="#fbeccd" stroke="#b87400" stroke-width="3.2"/><path d="M 540 796.0 L 540 822.0" stroke="#b87400" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="826.0" width="984" height="129.60000000000002" rx="14" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3.2"/><path d="M 540 959.6 L 540 985.6" stroke="#2e8b57" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="989.6" width="984" height="129.60000000000002" rx="14" fill="#eceff1" stroke="#5b6770" stroke-width="3.2"/><path d="M 540 1123.2 L 540 1149.2" stroke="#5b6770" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="1153.2" width="984" height="126.0" rx="14" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3.2"/></g><text x="48" y="86" font-size="56" font-weight="700" fill="#1f2933" text-anchor="start">Argo Rollouts</text><text x="48" y="130" font-size="28" font-weight="400" fill="#5b6770" text-anchor="start">Canary releases with real traffic weights</text><text x="48" y="168" font-size="20" font-weight="400" fill="#1d6fa5" text-anchor="start">GitOps and delivery  ·  Post 12 of 37</text><text x="963.0" y="63" font-size="19" font-weight="400" fill="#2e8b57" text-anchor="middle">ran on EKS</text><text x="72" y="234" font-size="19" font-weight="700" fill="#c0392b" text-anchor="start">THE OLD WAY</text><text x="72" y="266" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">A Deployment's rolling update: new pods replace old ones, and</text><text x="72" y="300" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">health checks are the only gate.</text><text x="72" y="397.6" font-size="19" font-weight="700" fill="#1d6fa5" text-anchor="start">WHY DEVFLOW DOES IT DIFFERENTLY</text><text x="72" y="430" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">• 20 percent, an analysis step, 50 percent, 100 percent, with the</text><text x="72" y="464" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">   weights written to the HTTPRoute through the Gateway API plugin,</text><text x="72" y="498" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">   so 20 percent means requests, not pods.</text><text x="72" y="532" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">• Analysis can query Mimir (error rate, p95, cost) or run a Job.</text><text x="72" y="565" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">• On failure it aborts and the stable version keeps serving.</text><text x="72" y="662.6" font-size="19" font-weight="700" fill="#b87400" text-anchor="start">WHAT BROKE</text><text x="72" y="695" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">The Rollout could not become healthy: ArgoCD created its HTTPRoute</text><text x="72" y="729" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">only after the Rollout was healthy (a sync-wave deadlock). Also,</text><text x="72" y="763" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">the plugin config sat under the wrong Helm key.</text><text x="72" y="860.0" font-size="19" font-weight="700" fill="#2e8b57" text-anchor="start">THE FIX</text><text x="72" y="892" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">Order the sync waves so the route, RBAC and templates come first;</text><text x="72" y="926" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">move trafficRouterPlugins under controller:.</text><text x="72" y="1023.6" font-size="19" font-weight="700" fill="#5b6770" text-anchor="start">WORTH KNOWING</text><text x="72" y="1056" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">The Rollouts dashboard is public and read-only (its role is</text><text x="72" y="1090" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">get/list/watch).</text><text x="78" y="1189.2" font-size="19" font-weight="700" fill="#2e8b57" text-anchor="start">TAKEAWAY</text><text x="78" y="1222" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">When ArgoCD waits for health, make sure what it waits for</text><text x="78" y="1261" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">doesn't need something it hasn't created yet.</text><text x="48" y="1320" font-size="18" font-weight="400" fill="#5b6770" text-anchor="start">DevFlow platform series · EKS · GitOps · AgentOps</text><text x="1032" y="1320" font-size="18" font-weight="400" fill="#5b6770" text-anchor="end">#ArgoRollouts</text></svg>