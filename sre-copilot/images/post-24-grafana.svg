<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="'Patrick Hand','Segoe Print','Comic Sans MS','Trebuchet MS',sans-serif"><defs><filter id="wob" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1f2933"/></marker></defs><rect width="1080" height="1350" fill="#fbfbf8"/><g filter="url(#wob)"><rect x="894" y="38" width="138" height="38" rx="10" fill="#dcf0e5" stroke="#2e8b57" stroke-width="2.6"/><rect x="48" y="200" width="984" height="95.80000000000001" rx="14" fill="#f8dedb" stroke="#c0392b" stroke-width="3.2"/><path d="M 540 299.8 L 540 325.8" stroke="#c0392b" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="329.8" width="984" height="197.20000000000002" rx="14" fill="#dcecf5" stroke="#1d6fa5" stroke-width="3.2"/><path d="M 540 531.0 L 540 557.0" stroke="#1d6fa5" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="561.0" width="984" height="163.4" rx="14" fill="#fbeccd" stroke="#b87400" stroke-width="3.2"/><path d="M 540 728.4 L 540 754.4" stroke="#b87400" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="758.4" width="984" height="129.60000000000002" rx="14" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3.2"/><path d="M 540 892.0 L 540 918.0" stroke="#2e8b57" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="922.0" width="984" height="129.60000000000002" rx="14" fill="#eceff1" stroke="#5b6770" stroke-width="3.2"/><path d="M 540 1055.6 L 540 1081.6" stroke="#5b6770" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="1085.6" width="984" height="126.0" rx="14" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3.2"/></g><text x="48" y="86" font-size="56" font-weight="700" fill="#1f2933" text-anchor="start">Grafana</text><text x="48" y="130" font-size="28" font-weight="400" fill="#5b6770" text-anchor="start">One UI over metrics, logs and traces</text><text x="48" y="168" font-size="20" font-weight="400" fill="#1d6fa5" text-anchor="start">Observability  ·  Post 24 of 37</text><text x="963.0" y="63" font-size="19" font-weight="400" fill="#2e8b57" text-anchor="middle">ran on EKS</text><text x="72" y="234" font-size="19" font-weight="700" fill="#c0392b" text-anchor="start">THE OLD WAY</text><text x="72" y="266" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">A separate UI per tool.</text><text x="72" y="363.8" font-size="19" font-weight="700" fill="#1d6fa5" text-anchor="start">WHY DEVFLOW DOES IT DIFFERENTLY</text><text x="72" y="396" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">• Mimir, Loki and Tempo behind one query surface.</text><text x="72" y="430" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">• Dashboards generated from code, so they come back with the</text><text x="72" y="464" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">   cluster through GitOps.</text><text x="72" y="498" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">• Public dashboards imported by id; none hand-maintained.</text><text x="72" y="595.0" font-size="19" font-weight="700" fill="#b87400" text-anchor="start">WHAT BROKE</text><text x="72" y="628" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">A datasource named 'Prometheus' pointed at a service that never</text><text x="72" y="661" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">existed; panels said 'No data', which looks like waiting. On the</text><text x="72" y="695" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">new cluster, dashboards referenced uids that didn't exist.</text><text x="72" y="792.4" font-size="19" font-weight="700" fill="#2e8b57" text-anchor="start">THE FIX</text><text x="72" y="825" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">Rename it Mimir, set explicit uids (mimir, loki, tempo) and use a</text><text x="72" y="859" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">${datasource} variable.</text><text x="72" y="956.0" font-size="19" font-weight="700" fill="#5b6770" text-anchor="start">WORTH KNOWING</text><text x="72" y="988" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">The live-cluster dashboard caught a real OOMKill on</text><text x="72" y="1022" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">argocd-repo-server.</text><text x="78" y="1121.6" font-size="19" font-weight="700" fill="#2e8b57" text-anchor="start">TAKEAWAY</text><text x="78" y="1155" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">Names and labels in this stack carry no guarantee of</text><text x="78" y="1194" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">still being true.</text><text x="48" y="1320" font-size="18" font-weight="400" fill="#5b6770" text-anchor="start">DevFlow platform series · EKS · GitOps · AgentOps</text><text x="1032" y="1320" font-size="18" font-weight="400" fill="#5b6770" text-anchor="end">#Grafana</text></svg>