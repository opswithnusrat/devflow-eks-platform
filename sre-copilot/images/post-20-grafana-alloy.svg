<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="'Patrick Hand','Segoe Print','Comic Sans MS','Trebuchet MS',sans-serif"><defs><filter id="wob" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1f2933"/></marker></defs><rect width="1080" height="1350" fill="#fbfbf8"/><g filter="url(#wob)"><rect x="894" y="38" width="138" height="38" rx="10" fill="#dcf0e5" stroke="#2e8b57" stroke-width="2.6"/><rect x="48" y="200" width="984" height="163.4" rx="14" fill="#f8dedb" stroke="#c0392b" stroke-width="3.2"/><path d="M 540 367.4 L 540 393.4" stroke="#c0392b" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="397.4" width="984" height="231.0" rx="14" fill="#dcecf5" stroke="#1d6fa5" stroke-width="3.2"/><path d="M 540 632.4 L 540 658.4" stroke="#1d6fa5" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="662.4" width="984" height="163.4" rx="14" fill="#fbeccd" stroke="#b87400" stroke-width="3.2"/><path d="M 540 829.8 L 540 855.8" stroke="#b87400" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="859.8" width="984" height="95.80000000000001" rx="14" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3.2"/><path d="M 540 959.5999999999999 L 540 985.5999999999999" stroke="#2e8b57" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="989.5999999999999" width="984" height="163.4" rx="14" fill="#eceff1" stroke="#5b6770" stroke-width="3.2"/><path d="M 540 1157.0 L 540 1183.0" stroke="#5b6770" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="1187.0" width="984" height="87.0" rx="14" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3.2"/></g><text x="48" y="86" font-size="56" font-weight="700" fill="#1f2933" text-anchor="start">Grafana Alloy</text><text x="48" y="130" font-size="28" font-weight="400" fill="#5b6770" text-anchor="start">One collector for metrics, logs and events</text><text x="48" y="168" font-size="20" font-weight="400" fill="#1d6fa5" text-anchor="start">Observability  ·  Post 20 of 37</text><text x="963.0" y="63" font-size="19" font-weight="400" fill="#2e8b57" text-anchor="middle">ran on EKS</text><text x="72" y="234" font-size="19" font-weight="700" fill="#c0392b" text-anchor="start">THE OLD WAY</text><text x="72" y="266" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">kube-prometheus-stack (about 15 components) plus Promtail:</text><text x="72" y="300" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">Prometheus stores locally then remote-writes, so storage is paid</text><text x="72" y="334" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">twice.</text><text x="72" y="431.4" font-size="19" font-weight="700" fill="#1d6fa5" text-anchor="start">WHY DEVFLOW DOES IT DIFFERENTLY</text><text x="72" y="464" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">• One Helm release, one config: alloy-metrics, alloy-logs and</text><text x="72" y="498" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">   alloy-singleton for cluster events.</text><text x="72" y="532" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">• Annotation autodiscovery: a new Service is scraped when it adds</text><text x="72" y="565" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">   the annotation.</text><text x="72" y="599" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">• No local Prometheus store.</text><text x="72" y="696.4" font-size="19" font-weight="700" fill="#b87400" text-anchor="start">WHAT BROKE</text><text x="72" y="729" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">No single big bug. Trade-offs: kube-proxy scraping is disabled</text><text x="72" y="763" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">because Cilium replaced it, and a 30-second scrape interval halves</text><text x="72" y="796" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">sample volume against the 15-second default.</text><text x="72" y="893.8" font-size="19" font-weight="700" fill="#2e8b57" text-anchor="start">THE FIX</text><text x="72" y="926" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">Decide the resolution you need, not the default.</text><text x="72" y="1023.5999999999999" font-size="19" font-weight="700" fill="#5b6770" text-anchor="start">WORTH KNOWING</text><text x="72" y="1056" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">Before the stress test, I checked the scraped series had namespace</text><text x="72" y="1090" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">and service labels: the autoscaler and the canary both depend on</text><text x="72" y="1124" font-size="26" font-weight="400" fill="#1f2933" text-anchor="start">them.</text><text x="78" y="1223.0" font-size="19" font-weight="700" fill="#2e8b57" text-anchor="start">TAKEAWAY</text><text x="78" y="1256" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">Every pod you don't run is an incident you never have.</text><text x="48" y="1320" font-size="18" font-weight="400" fill="#5b6770" text-anchor="start">DevFlow platform series · EKS · GitOps · AgentOps</text><text x="1032" y="1320" font-size="18" font-weight="400" fill="#5b6770" text-anchor="end">#Grafana</text></svg>