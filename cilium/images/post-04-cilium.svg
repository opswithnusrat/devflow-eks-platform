<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="'Patrick Hand','Segoe Print','Comic Sans MS','Trebuchet MS',sans-serif"><defs><filter id="wob" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1f2933"/></marker></defs><rect width="1080" height="1350" fill="#fbfbf8"/><g filter="url(#wob)"><rect x="894" y="38" width="138" height="38" rx="10" fill="#dcf0e5" stroke="#2e8b57" stroke-width="2.6"/><rect x="48" y="200" width="984" height="119.2" rx="14" fill="#f8dedb" stroke="#c0392b" stroke-width="3.2"/><path d="M 540 323.2 L 540 349.2" stroke="#c0392b" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="353.2" width="984" height="233.6" rx="14" fill="#dcecf5" stroke="#1d6fa5" stroke-width="3.2"/><path d="M 540 590.8 L 540 616.8" stroke="#1d6fa5" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="620.8" width="984" height="119.2" rx="14" fill="#fbeccd" stroke="#b87400" stroke-width="3.2"/><path d="M 540 744.0 L 540 770.0" stroke="#b87400" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="774.0" width="984" height="147.8" rx="14" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3.2"/><path d="M 540 925.8 L 540 951.8" stroke="#2e8b57" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="955.8" width="984" height="119.2" rx="14" fill="#eceff1" stroke="#5b6770" stroke-width="3.2"/><path d="M 540 1079.0 L 540 1105.0" stroke="#5b6770" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="1109.0" width="984" height="115.60000000000001" rx="14" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3.2"/></g><text x="48" y="86" font-size="56" font-weight="700" fill="#1f2933" text-anchor="start">Cilium</text><text x="48" y="130" font-size="28" font-weight="400" fill="#5b6770" text-anchor="start">eBPF CNI that also replaces kube-proxy</text><text x="48" y="168" font-size="20" font-weight="400" fill="#1d6fa5" text-anchor="start">Networking  ·  Post 4 of 37</text><text x="963.0" y="63" font-size="19" font-weight="400" fill="#2e8b57" text-anchor="middle">ran on EKS</text><text x="72" y="234" font-size="19" font-weight="700" fill="#c0392b" text-anchor="start">THE OLD WAY</text><text x="72" y="262" font-size="22" font-weight="400" fill="#1f2933" text-anchor="start">AWS VPC CNI plus kube-proxy: every Service is a chain of iptables rules</text><text x="72" y="290" font-size="22" font-weight="400" fill="#1f2933" text-anchor="start">scanned top to bottom.</text><text x="72" y="387.2" font-size="19" font-weight="700" fill="#1d6fa5" text-anchor="start">WHY DEVFLOW DOES IT DIFFERENTLY</text><text x="72" y="415" font-size="22" font-weight="400" fill="#1f2933" text-anchor="start">• Service routing is a hash lookup in the kernel instead of a rule scan, and</text><text x="72" y="443" font-size="22" font-weight="400" fill="#1f2933" text-anchor="start">   kube-proxy is gone.</text><text x="72" y="472" font-size="22" font-weight="400" fill="#1f2933" text-anchor="start">• ENI IPAM with prefix delegation gives pods real VPC IPs; native routing</text><text x="72" y="501" font-size="22" font-weight="400" fill="#1f2933" text-anchor="start">   means no tunnel.</text><text x="72" y="529" font-size="22" font-weight="400" fill="#1f2933" text-anchor="start">• Gateway API, Maglev load balancing and Hubble flow visibility come from the</text><text x="72" y="558" font-size="22" font-weight="400" fill="#1f2933" text-anchor="start">   same component.</text><text x="72" y="654.8" font-size="19" font-weight="700" fill="#b87400" text-anchor="start">WHAT BROKE</text><text x="72" y="682" font-size="22" font-weight="400" fill="#1f2933" text-anchor="start">Native routing returned traffic across nodes that was masqueraded and dropped.</text><text x="72" y="711" font-size="22" font-weight="400" fill="#1f2933" text-anchor="start">No error: connections just timed out.</text><text x="72" y="808.0" font-size="19" font-weight="700" fill="#2e8b57" text-anchor="start">THE FIX</text><text x="72" y="836" font-size="22" font-weight="400" fill="#1f2933" text-anchor="start">Gate the install on cross-node checks, and configure masquerading through the</text><text x="72" y="864" font-size="22" font-weight="400" fill="#1f2933" text-anchor="start">primary ENI with the netkit datapath so secondary ENIs aren't in the return</text><text x="72" y="893" font-size="22" font-weight="400" fill="#1f2933" text-anchor="start">path.</text><text x="72" y="989.8" font-size="19" font-weight="700" fill="#5b6770" text-anchor="start">WORTH KNOWING</text><text x="72" y="1017" font-size="22" font-weight="400" fill="#1f2933" text-anchor="start">netkit attaches BPF programs atomically at device creation; veth + TC leaves a</text><text x="72" y="1046" font-size="22" font-weight="400" fill="#1f2933" text-anchor="start">short window with no program (kernel 6.8 or newer, nodes run 6.12).</text><text x="78" y="1145.0" font-size="19" font-weight="700" fill="#2e8b57" text-anchor="start">TAKEAWAY</text><text x="78" y="1174" font-size="26" font-weight="700" fill="#1f2933" text-anchor="start">The defaults assume a topology that isn't yours. Understand the</text><text x="78" y="1207" font-size="26" font-weight="700" fill="#1f2933" text-anchor="start">packet path, don't just helm install.</text><text x="48" y="1320" font-size="18" font-weight="400" fill="#5b6770" text-anchor="start">DevFlow platform series · EKS · GitOps · AgentOps</text><text x="1032" y="1320" font-size="18" font-weight="400" fill="#5b6770" text-anchor="end">#Cilium</text></svg>