<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="'Patrick Hand','Segoe Print','Comic Sans MS','Trebuchet MS',sans-serif"><defs><filter id="wob" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1f2933"/></marker></defs><rect width="1080" height="1350" fill="#fbfbf8"/><g filter="url(#wob)"><rect x="894" y="38" width="138" height="38" rx="10" fill="#dcf0e5" stroke="#2e8b57" stroke-width="2.6"/><rect x="48" y="200" width="984" height="124.4" rx="14" fill="#f8dedb" stroke="#c0392b" stroke-width="3.2"/><path d="M 540 328.4 L 540 354.4" stroke="#c0392b" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="358.4" width="984" height="249.20000000000002" rx="14" fill="#dcecf5" stroke="#1d6fa5" stroke-width="3.2"/><path d="M 540 611.6 L 540 637.6" stroke="#1d6fa5" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="641.6" width="984" height="186.8" rx="14" fill="#fbeccd" stroke="#b87400" stroke-width="3.2"/><path d="M 540 832.4000000000001 L 540 858.4000000000001" stroke="#b87400" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="862.4000000000001" width="984" height="124.4" rx="14" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3.2"/><path d="M 540 990.8000000000001 L 540 1016.8000000000001" stroke="#2e8b57" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="1020.8000000000001" width="984" height="93.2" rx="14" fill="#eceff1" stroke="#5b6770" stroke-width="3.2"/><path d="M 540 1118.0 L 540 1144.0" stroke="#5b6770" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="1148.0" width="984" height="120.8" rx="14" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3.2"/></g><text x="48" y="86" font-size="56" font-weight="700" fill="#1f2933" text-anchor="start">ArgoCD ApplicationSets</text><text x="48" y="130" font-size="28" font-weight="400" fill="#5b6770" text-anchor="start">Deploys every tool from a folder in Git</text><text x="48" y="168" font-size="20" font-weight="400" fill="#1d6fa5" text-anchor="start">GitOps and delivery  ·  Post 10 of 37</text><text x="963.0" y="63" font-size="19" font-weight="400" fill="#2e8b57" text-anchor="middle">ran on EKS</text><text x="72" y="234" font-size="19" font-weight="700" fill="#c0392b" text-anchor="start">THE OLD WAY</text><text x="72" y="264" font-size="24" font-weight="400" fill="#1f2933" text-anchor="start">Helm installs from a laptop, or a CI job that runs kubectl apply against</text><text x="72" y="295" font-size="24" font-weight="400" fill="#1f2933" text-anchor="start">the cluster.</text><text x="72" y="392.4" font-size="19" font-weight="700" fill="#1d6fa5" text-anchor="start">WHY DEVFLOW DOES IT DIFFERENTLY</text><text x="72" y="422" font-size="24" font-weight="400" fill="#1f2933" text-anchor="start">• One ApplicationSet with a directory glob turns each</text><text x="72" y="454" font-size="24" font-weight="400" fill="#1f2933" text-anchor="start">   platform/&lt;area&gt;/&lt;tool&gt; into an Application.</text><text x="72" y="485" font-size="24" font-weight="400" fill="#1f2933" text-anchor="start">• Turning a tool on or off is one exclude: true/false line and a push;</text><text x="72" y="516" font-size="24" font-weight="400" fill="#1f2933" text-anchor="start">   the AppProject comes from the path.</text><text x="72" y="547" font-size="24" font-weight="400" fill="#1f2933" text-anchor="start">• selfHeal: true reverts manual edits, so 'what's running' is answered</text><text x="72" y="578" font-size="24" font-weight="400" fill="#1f2933" text-anchor="start">   by the repo tree.</text><text x="72" y="675.6" font-size="19" font-weight="700" fill="#b87400" text-anchor="start">WHAT BROKE</text><text x="72" y="706" font-size="24" font-weight="400" fill="#1f2933" text-anchor="start">Two: the template assumed folder name = namespace (VPA deploys to</text><text x="72" y="737" font-size="24" font-weight="400" fill="#1f2933" text-anchor="start">vpa-system), and the ApplicationSet kept overwriting the digest that</text><text x="72" y="768" font-size="24" font-weight="400" fill="#1f2933" text-anchor="start">Image Updater wrote, so the agent's Rollout went from Revision 12 to 21</text><text x="72" y="799" font-size="24" font-weight="400" fill="#1f2933" text-anchor="start">with no change from me.</text><text x="72" y="896.4000000000001" font-size="19" font-weight="700" fill="#2e8b57" text-anchor="start">THE FIX</text><text x="72" y="926" font-size="24" font-weight="400" fill="#1f2933" text-anchor="start">An override list for namespaces, and ignoreApplicationDifferences on</text><text x="72" y="958" font-size="24" font-weight="400" fill="#1f2933" text-anchor="start">/spec/source/kustomize.</text><text x="72" y="1054.8000000000002" font-size="19" font-weight="700" fill="#5b6770" text-anchor="start">WORTH KNOWING</text><text x="72" y="1085" font-size="24" font-weight="400" fill="#1f2933" text-anchor="start">22 apps were generated on the Oct 29 run.</text><text x="78" y="1184.0" font-size="19" font-weight="700" fill="#2e8b57" text-anchor="start">TAKEAWAY</text><text x="78" y="1215" font-size="28" font-weight="700" fill="#1f2933" text-anchor="start">When two controllers own one field, they fight politely</text><text x="78" y="1251" font-size="28" font-weight="700" fill="#1f2933" text-anchor="start">forever.</text><text x="48" y="1320" font-size="18" font-weight="400" fill="#5b6770" text-anchor="start">DevFlow platform series · EKS · GitOps · AgentOps</text><text x="1032" y="1320" font-size="18" font-weight="400" fill="#5b6770" text-anchor="end">#ArgoCD</text></svg>