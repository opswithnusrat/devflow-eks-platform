<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="'Patrick Hand','Segoe Print','Comic Sans MS','Trebuchet MS',sans-serif"><defs><filter id="wob" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1f2933"/></marker></defs><rect width="1080" height="1350" fill="#fbfbf8"/><g filter="url(#wob)"><rect x="894" y="38" width="138" height="38" rx="10" fill="#dcf0e5" stroke="#2e8b57" stroke-width="2.6"/><rect x="48" y="200" width="984" height="134.8" rx="14" fill="#f8dedb" stroke="#c0392b" stroke-width="3.2"/><path d="M 540 338.8 L 540 364.8" stroke="#c0392b" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="368.8" width="984" height="280.4" rx="14" fill="#dcecf5" stroke="#1d6fa5" stroke-width="3.2"/><path d="M 540 653.2 L 540 679.2" stroke="#1d6fa5" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="683.2" width="984" height="171.2" rx="14" fill="#fbeccd" stroke="#b87400" stroke-width="3.2"/><path d="M 540 858.4000000000001 L 540 884.4000000000001" stroke="#b87400" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="888.4000000000001" width="984" height="98.4" rx="14" fill="#eceff1" stroke="#5b6770" stroke-width="3.2"/><path d="M 540 990.8000000000001 L 540 1016.8000000000001" stroke="#5b6770" stroke-width="3.2" fill="none" marker-end="url(#ah)"/><rect x="48" y="1020.8000000000001" width="984" height="131.2" rx="14" fill="#dcf0e5" stroke="#2e8b57" stroke-width="3.2"/></g><text x="48" y="86" font-size="56" font-weight="700" fill="#1f2933" text-anchor="start">Headlamp</text><text x="48" y="130" font-size="28" font-weight="400" fill="#5b6770" text-anchor="start">A Kubernetes UI with no external dependencies</text><text x="48" y="168" font-size="20" font-weight="400" fill="#1d6fa5" text-anchor="start">Observability  ·  Post 25 of 37</text><text x="963.0" y="63" font-size="19" font-weight="400" fill="#2e8b57" text-anchor="middle">ran on EKS</text><text x="72" y="234" font-size="19" font-weight="700" fill="#c0392b" text-anchor="start">THE OLD WAY</text><text x="72" y="269" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">A dashboard that needs its own credential store or a</text><text x="72" y="305" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">kubeconfig to manage.</text><text x="72" y="402.8" font-size="19" font-weight="700" fill="#1d6fa5" text-anchor="start">WHY DEVFLOW DOES IT DIFFERENTLY</text><text x="72" y="438" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">• In-cluster mode: it authenticates with its own</text><text x="72" y="474" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">   ServiceAccount token.</text><text x="72" y="511" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">• Same setup on every fresh cluster: wait for sync, run</text><text x="72" y="547" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">   kubectl create token headlamp -n headlamp, paste.</text><text x="72" y="583" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">• Grafana answers 'what are the numbers'; Headlamp answers</text><text x="72" y="620" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">   'what is deployed'.</text><text x="72" y="717.2" font-size="19" font-weight="700" fill="#b87400" text-anchor="start">WHAT BROKE</text><text x="72" y="752" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">No bug here. The risk to manage: The ServiceAccount is</text><text x="72" y="789" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">cluster-admin, so the token is the only access control. I</text><text x="72" y="825" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">generate tokens with an explicit duration.</text><text x="72" y="922.4000000000001" font-size="19" font-weight="700" fill="#5b6770" text-anchor="start">WORTH KNOWING</text><text x="72" y="957" font-size="28" font-weight="400" fill="#1f2933" text-anchor="start">Headlamp's events view surfaced the failed canary eval Job.</text><text x="78" y="1056.8000000000002" font-size="19" font-weight="700" fill="#2e8b57" text-anchor="start">TAKEAWAY</text><text x="78" y="1092" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">The fewer things a tool depends on, the fewer ways it</text><text x="78" y="1134" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">can silently disagree with something else.</text><text x="48" y="1320" font-size="18" font-weight="400" fill="#5b6770" text-anchor="start">DevFlow platform series · EKS · GitOps · AgentOps</text><text x="1032" y="1320" font-size="18" font-weight="400" fill="#5b6770" text-anchor="end">#Headlamp</text></svg>