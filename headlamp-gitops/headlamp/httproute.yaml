apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    external-dns.alpha.kubernetes.io/hostname: headlamp.devflow.nusratdops.online
spec:
  parentRefs:
    - name: devflow-gateway
      namespace: gateway-system
      sectionName: https
    - name: devflow-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - headlamp.devflow.nusratdops.online
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80
